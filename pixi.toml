[workspace]
name = "azo-plugin-directives"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.11"
pyyaml = "*"

[pypi-dependencies]
agent-utils = ">=0.3.0"

[tool.agent-zoo.plugin]
name = "azo-plugin-directives"
default = ["src/directives.py"]

[tool.agent-zoo.plugin.config]
files = ["directives.yaml"]
